<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stadshoeve Vrijwilligers</title>
  <!-- Het uiterlijk van de app staat in stijl.css -->
  <link rel="stylesheet" href="stijl.css">
</head>
<body>
  <header><h1 id="titel">Mijn taken</h1></header>

  <!-- Hier zet het script de inhoud van het scherm neer -->
  <main id="inhoud"></main>

  <!-- Melding die even verschijnt na een actie -->
  <div id="melding" class="melding" role="status" aria-live="polite" hidden>
    <span id="melding-tekst"></span>
    <button id="knop-ongedaan">Ongedaan maken</button>
  </div>

  <!-- Menu: "data-scherm" zegt welk scherm bij de knop hoort -->
  <nav>
    <button data-scherm="mijn">Mijn taken</button>
    <button data-scherm="werkgroep">Werkgroep</button>
    <button data-scherm="melden">Melden</button>
    <button data-scherm="meldingen">Meldingen</button>
  </nav>

  <!-- De logica van de app staat in app.js. Staat onderaan, zodat de pagina eerst geladen is. -->
  <script src="app.js"></script>
</body>
</html>
