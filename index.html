<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stadshoeve Vrijwilligers</title>
  <style>
    /* ===== KLEUREN: hier op één plek, zodat je ze makkelijk kunt aanpassen ===== */
    :root {
      --groen: #2e5d34;
      --tekst: #1a1a1a;
      --grijs: #555555;
      --rand: #cccccc;
      --achtergrond: #f4f4f2;
      --rood: #a4161a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      font-size: 18px;
      color: var(--tekst);
      background: var(--achtergrond);
    }
    header { background: var(--groen); color: #ffffff; padding: 16px; position: sticky; top: 0; }
    h1 { margin: 0; font-size: 22px; }
    main { padding: 16px; padding-bottom: 180px; } /* ruimte vrij voor menu én melding onderaan */

    /* Knoppen om een werkgroep te kiezen */
    .kiezer { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .kiezer button {
      min-height: 48px; padding: 0 16px; font-size: 16px;
      border: 2px solid var(--groen); border-radius: 24px;
      background: #ffffff; color: var(--groen);
    }
    .kiezer button[aria-pressed="true"] { background: var(--groen); color: #ffffff; font-weight: bold; }

    /* Eén taak */
    .taak { background: #ffffff; border: 1px solid var(--rand); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .taak h2 { margin: 0 0 4px; font-size: 19px; }
    .taak p { margin: 4px 0; }
    .details { color: var(--grijs); font-size: 16px; }
    .te-laat { color: var(--rood); font-weight: bold; }
    .status { display: inline-block; margin-top: 8px; padding: 4px 10px; border-radius: 4px; font-size: 16px; font-weight: bold; }
    .status-open { background: #e8eef9; color: #1d3d7a; }
    .status-gereed { background: #e3f1e4; color: #1e4d24; }
    .leeg { color: var(--grijs); }

    /* Knop "Gereed melden" (de hoofdactie, daarom groot en gevuld) */
    .knop-gereed {
      display: block; width: 100%; min-height: 56px; margin-top: 12px;
      font-size: 18px; font-weight: bold;
      background: var(--groen); color: #ffffff; border: none; border-radius: 8px;
    }

    /* Knop "Foto toevoegen" (tweede actie, daarom alleen een rand) */
    .knop-foto {
      display: flex; align-items: center; justify-content: center;
      width: 100%; min-height: 48px; margin-top: 12px;
      font-size: 16px; font-weight: bold;
      border: 2px solid var(--groen); border-radius: 8px;
      background: #ffffff; color: var(--groen);
    }
    .foto-tip { font-size: 16px; color: var(--grijs); }
    .foto { display: block; width: 100%; margin-top: 12px; border-radius: 8px; }

    /* Tweede knoppen ("Weer openen", "Foto verwijderen", "Ik doe dit"): alleen een grijze rand */
    .knop-tweede {
      display: block; width: 100%; min-height: 48px; margin-top: 12px;
      font-size: 16px; font-weight: bold;
      border: 2px solid var(--grijs); border-radius: 8px;
      background: #ffffff; color: var(--tekst);
    }

    /* NIEUW: keuzelijst "Toegewezen aan" (voor bestuur en coördinator) */
    .toewijzen { display: block; margin-top: 12px; font-size: 16px; font-weight: bold; }
    .toewijzen select {
      display: block; width: 100%; min-height: 48px; margin-top: 4px; padding: 0 12px;
      font-size: 18px;  /* 16px of meer: anders zoomt de iPhone in bij aantikken */
      border: 2px solid var(--grijs); border-radius: 8px;
      background: #ffffff; color: var(--tekst);
    }

    /* Maakt iets onzichtbaar maar laat het wel werken (voor de foto-invoer) */
    .verborgen { position: absolute; width: 1px; height: 1px; opacity: 0; }

    /* Melding onderaan met "Ongedaan maken" */
    .melding {
      position: fixed; left: 16px; right: 16px;
      bottom: calc(76px + env(safe-area-inset-bottom));
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      background: #1a1a1a; color: #ffffff; border-radius: 8px; padding: 12px 16px;
    }
    .melding[hidden] { display: none; }
    .melding button {
      min-height: 48px; padding: 0 16px; font-size: 16px; font-weight: bold;
      background: #ffffff; color: #1a1a1a; border: none; border-radius: 6px;
    }

    /* Menu onderaan: binnen bereik van je duim */
    nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: flex; background: #ffffff; border-top: 1px solid var(--rand);
      padding-bottom: env(safe-area-inset-bottom); /* ruimte voor de streep onderaan op iPhones */
    }
    nav button { flex: 1; min-height: 64px; font-size: 16px; border: none; background: none; color: var(--grijs); }
    nav button[aria-current="page"] { color: var(--groen); font-weight: bold; border-top: 4px solid var(--groen); }
  </style>
</head>
<body>
  <header><h1 id="titel">Mijn taken</h1></header>

  <!-- Hier zet het script de taken neer -->
  <main id="inhoud"></main>

  <!-- Melding die even verschijnt na een actie -->
  <div id="melding" class="melding" role="status" aria-live="polite" hidden>
    <span id="melding-tekst"></span>
    <button id="knop-ongedaan">Ongedaan maken</button>
  </div>

  <nav>
    <button id="knop-mijn">Mijn taken</button>
    <button id="knop-werkgroep">Werkgroep</button>
  </nav>

  <script>
    // ===== VOORBEELDGEGEVENS =====
    // Tijdelijk: later komen deze uit de database.
    // Gebruik hier NOOIT echte namen: deze code is openbaar.

    // Wie is er "ingelogd"? (nep, om te testen)
    const ingelogdeGebruiker = {
      naam: "Anna",
      werkgroepen: ["Dieren", "Klussen"],
      magAllesZien: false,  // true = bestuur of coördinator onderhoud
      isFrion: false        // NIEUW: true = Frion-begeleider
    };

    const alleWerkgroepen = ["Dieren", "Tuinen", "Klussen", "Avontuurlijk Spelen", "Educatie", "Evenementen", "Geschiedenis"];

    // NIEUW: alle vrijwilligers en hun werkgroepen. Nodig voor de keuzelijst bij toewijzen.
    const vrijwilligers = [
      { naam: "Anna",   werkgroepen: ["Dieren", "Klussen"] },
      { naam: "Piet",   werkgroepen: ["Dieren"] },
      { naam: "Fatima", werkgroepen: ["Tuinen", "Avontuurlijk Spelen"] },
      { naam: "Kees",   werkgroepen: ["Evenementen", "Klussen"] },
      { naam: "Sanne",  werkgroepen: ["Educatie", "Geschiedenis"] },
      { naam: "Paul",  werkgroepen: ["Tuinen", "Geschiedenis"] }
    ];

    // NIEUW: de naam waarmee een taak aan Frion als groep wordt toegewezen
    const FRION = "Frion";

    const taken = [
      { titel: "Hek weide 2 repareren", omschrijving: "Onderste plank zit los bij de ingang.", werkgroep: "Klussen", toegewezenAan: "Anna", deadline: "2026-10-08", status: "open" },
      { titel: "Hooi bestellen", omschrijving: "Voorraad op de hooizolder is bijna op.", werkgroep: "Dieren", toegewezenAan: "Anna", deadline: "2026-10-14", status: "open" },
      { titel: "Waterpomp winterklaar maken", omschrijving: "Pomp bij het waterspelen aftappen.", werkgroep: "Klussen", toegewezenAan: "Anna", deadline: "2026-10-03", status: "gereed", gereedGemeldDoor: "Anna" },
      { titel: "Konijnenhok extra uitmesten", omschrijving: "Na de herfstvakantie.", werkgroep: "Dieren", toegewezenAan: "Piet", deadline: "2026-10-27", status: "open" },
      { titel: "Lampen schuur vervangen", omschrijving: "Twee tl-buizen zijn kapot.", werkgroep: "Klussen", toegewezenAan: "", deadline: "2026-10-20", status: "open" },
      { titel: "Drinkbak ezels schoonmaken", omschrijving: "Algen verwijderen en vers water.", werkgroep: "Dieren", toegewezenAan: "", deadline: "2026-10-16", status: "open" },
      { titel: "Stal uitmesten", omschrijving: "Alle zes boxen, vers stro erin.", werkgroep: "Dieren", toegewezenAan: "Frion", deadline: "2026-10-13", status: "open" },
      { titel: "Bollen planten belevenistuin", omschrijving: "Bollen liggen in de kas.", werkgroep: "Tuinen", toegewezenAan: "Fatima", deadline: "2026-10-25", status: "open" },
      { titel: "Pad in de Hummelhoeve vegen", omschrijving: "Met de harde bezem.", werkgroep: "Avontuurlijk Spelen", toegewezenAan: "Fatima", deadline: "2026-10-25", status: "open" },
      { titel: "Lampionnen voorbereiden", omschrijving: "Materiaal klaarzetten voor de workshop.", werkgroep: "Evenementen", toegewezenAan: "Kees", deadline: "2026-11-05", status: "open" }
    ];

    // Hoe lang de melding "Ongedaan maken" zichtbaar blijft (in milliseconden: 6000 = 6 seconden)
    const MELDING_DUUR = 6000;

    // ===== HULPFUNCTIES =====

    // De datum van vandaag, in dezelfde vorm als de deadlines ("2026-10-11")
    const vandaag = new Date().toISOString().slice(0, 10);

    // Zet "2026-10-14" om in "di 14 okt"
    function leesbareDatum(datum) {
      return new Date(datum).toLocaleDateString("nl-NL", { weekday: "short", day: "numeric", month: "short" });
    }

    // Volgorde: open taken eerst, daarna op deadline (vroegste bovenaan)
    function sorteerTaken(a, b) {
      if (a.status !== b.status) return a.status === "open" ? -1 : 1;
      return a.deadline.localeCompare(b.deadline);
    }

    // NIEUW: onder welke naam wijs je een taak aan jezelf toe?
    // Een Frion-begeleider pakt taken op namens Frion, de rest onder eigen naam.
    const mijnToewijsNaam = ingelogdeGebruiker.isFrion ? FRION : ingelogdeGebruiker.naam;

    // NIEUW: is deze taak van mij? (of van Frion, als ik Frion-begeleider ben)
    function isMijnTaak(taak) {
      return taak.toegewezenAan === mijnToewijsNaam;
    }

    // Mag de ingelogde gebruiker deze taak gereed melden?
    // Ja als: je alles mag zien (bestuur/coördinator), de taak in jouw werkgroep valt,
    // of de taak aan jou is toegewezen.
    function magGereedMelden(taak) {
      return ingelogdeGebruiker.magAllesZien
        || ingelogdeGebruiker.werkgroepen.includes(taak.werkgroep)
        || isMijnTaak(taak);
    }

    // NIEUW: mag ik deze taak zelf oppakken met "Ik doe dit"?
    // Ja als: de taak open is, nog van niemand is, en in mijn werkgroep valt.
    function magZelfOppakken(taak) {
      return taak.status === "open"
        && !taak.toegewezenAan
        && ingelogdeGebruiker.werkgroepen.includes(taak.werkgroep);
    }

    // Maakt het "kaartje" voor één taak
    function maakTaakKaart(taak) {
      const kaart = document.createElement("article");
      kaart.className = "taak";

      const titel = document.createElement("h2");
      titel.textContent = taak.titel;
      kaart.append(titel);

      const omschrijving = document.createElement("p");
      omschrijving.textContent = taak.omschrijving;
      kaart.append(omschrijving);

      const details = document.createElement("p");
      details.className = "details";
      const wie = taak.toegewezenAan || "Nog niemand";
      details.textContent = "Uiterlijk " + leesbareDatum(taak.deadline) + " · " + taak.werkgroep + " · " + wie;
      kaart.append(details);

      // Waarschuwing in tekst én kleur (nooit alleen kleur)
      if (taak.status === "open" && taak.deadline < vandaag) {
        const teLaat = document.createElement("p");
        teLaat.className = "te-laat";
        teLaat.textContent = "⚠ Te laat";
        kaart.append(teLaat);
      }

      const status = document.createElement("span");
      status.className = "status status-" + taak.status;
      status.textContent = taak.status === "gereed"
        ? "✓ Gereed gemeld door " + taak.gereedGemeldDoor
        : "○ Open";
      kaart.append(status);

      // NIEUW: toewijzen bij open taken
      if (taak.status === "open") {
        if (ingelogdeGebruiker.magAllesZien) {
          kaart.append(maakToewijsKeuze(taak));              // bestuur/coördinator: keuzelijst
        } else if (magZelfOppakken(taak)) {
          kaart.append(maakTweedeKnop("🙋 Ik doe dit", () => wijsToe(taak, mijnToewijsNaam)));
        } else if (isMijnTaak(taak)) {
          // Je eigen taak: je kunt hem teruggeven ("" = aan niemand)
          kaart.append(maakTweedeKnop("↩ Teruggeven", () => wijsToe(taak, "")));
        }
      }

      // Knop "Gereed melden" bij open taken
      if (taak.status === "open" && taak.toegewezenAan && magGereedMelden(taak)) {
        const knop = document.createElement("button");
        knop.className = "knop-gereed";
        knop.textContent = "✓ Gereed melden";
        knop.addEventListener("click", () => meldGereed(taak));
        kaart.append(knop);
      }

      // Foto en knoppen bij gereed gemelde taken
      if (taak.status === "gereed") {
        if (taak.foto) {
          const foto = document.createElement("img");
          foto.className = "foto";
          foto.src = taak.foto;
          foto.alt = "Foto bij de taak: " + taak.titel;
          kaart.append(foto);
        }
        if (magGereedMelden(taak)) {
          const fotoTekst = taak.foto ? "📷 Foto vervangen" : "📷 Foto toevoegen";
          kaart.append(maakFotoKnop(taak, fotoTekst));
          if (taak.foto) {
            kaart.append(maakTweedeKnop("Foto verwijderen", () => verwijderFoto(taak)));
          }
          kaart.append(maakTweedeKnop("↺ Weer openen", () => heropenTaak(taak)));
        }
      }

      return kaart;
    }

    // NIEUW: keuzelijst "Toegewezen aan" voor bestuur en coördinator.
    // Je kiest uit: niemand, de leden van de werkgroep van deze taak, of Frion.
    function maakToewijsKeuze(taak) {
      const label = document.createElement("label");
      label.className = "toewijzen";
      label.textContent = "Toegewezen aan";

      const keuze = document.createElement("select");

      // Namen van alle leden van de werkgroep van deze taak
      const leden = vrijwilligers
        .filter(v => v.werkgroepen.includes(taak.werkgroep))
        .map(v => v.naam);
      const opties = ["", ...leden, FRION];   // "" betekent: nog niemand

      // Staat de taak op naam van iemand buiten de werkgroep? Toon die ook.
      if (taak.toegewezenAan && !opties.includes(taak.toegewezenAan)) {
        opties.push(taak.toegewezenAan);
      }

      // Bestuur en coördinator kunnen een taak altijd aan zichzelf toewijzen
      if (!opties.includes(mijnToewijsNaam)) {
        opties.push(mijnToewijsNaam);
      }
      
      opties.forEach(naam => {
        const optie = document.createElement("option");
        optie.value = naam;
        optie.textContent = naam || "Nog niemand";
        optie.selected = naam === taak.toegewezenAan;
        keuze.append(optie);
      });

      keuze.addEventListener("change", () => wijsToe(taak, keuze.value));
      label.append(keuze);
      return label;
    }

    // NIEUW: wijst een taak toe aan een naam ("" = aan niemand)
    function wijsToe(taak, naam) {
      const vorige = taak.toegewezenAan;   // onthouden voor "Ongedaan maken"
      taak.toegewezenAan = naam;
      verversScherm();
      const tekst = naam ? "Toegewezen aan " + naam : "Taak is weer vrij";
      toonMelding(tekst, () => {
        taak.toegewezenAan = vorige;
        verversScherm();
      });
    }

    // Maakt de knop "Foto toevoegen" of "Foto vervangen".
    // Het is een label met een verborgen bestandskiezer erin: tik je op het label,
    // dan vraagt de telefoon of je een foto wilt maken of kiezen.
    function maakFotoKnop(taak, knopTekst) {
      const blok = document.createElement("div");

      const label = document.createElement("label");
      label.className = "knop-foto";
      label.textContent = knopTekst;

      const invoer = document.createElement("input");
      invoer.type = "file";
      invoer.accept = "image/*";         // alleen foto's
      invoer.className = "verborgen";
      invoer.addEventListener("change", () => {
        const bestand = invoer.files[0];
        if (!bestand) return;            // niets gekozen: niets doen
        const vorigeFoto = taak.foto;    // onthouden voor "Ongedaan maken"
        // Tijdelijk: de foto staat alleen in het geheugen van de telefoon.
        taak.foto = URL.createObjectURL(bestand);
        verversScherm();
        toonMelding(vorigeFoto ? "Foto vervangen" : "Foto toegevoegd", () => {
          taak.foto = vorigeFoto;
          verversScherm();
        });
      });
      label.append(invoer);
      blok.append(label);

      // Privacy-tip, in gewone taal
      const tip = document.createElement("p");
      tip.className = "foto-tip";
      tip.textContent = "Fotografeer alleen het werk, geen mensen.";
      blok.append(tip);

      return blok;
    }

    // Zet een taak op gereed en laat de melding met "Ongedaan maken" zien
    function meldGereed(taak) {
      taak.status = "gereed";
      taak.gereedGemeldDoor = ingelogdeGebruiker.naam;
      verversScherm();
      toonMelding("Taak gereed gemeld", () => {
        taak.status = "open";
        taak.gereedGemeldDoor = "";
        taak.foto = "";
        verversScherm();
      });
    }

    // Maakt een eenvoudige tweede knop (met rand)
    function maakTweedeKnop(tekst, actie) {
      const knop = document.createElement("button");
      knop.className = "knop-tweede";
      knop.textContent = tekst;
      knop.addEventListener("click", actie);
      return knop;
    }

    // Zet een gereed gemelde taak weer op open
    function heropenTaak(taak) {
      // Eerst onthouden hoe het was, zodat "Ongedaan maken" het kan terugzetten
      const vorigeDoor = taak.gereedGemeldDoor;
      const vorigeFoto = taak.foto;
      taak.status = "open";
      taak.gereedGemeldDoor = "";
      taak.foto = "";
      verversScherm();
      toonMelding("Taak staat weer open", () => {
        taak.status = "gereed";
        taak.gereedGemeldDoor = vorigeDoor;
        taak.foto = vorigeFoto;
        verversScherm();
      });
    }

    // Haalt de foto weg (bijvoorbeeld als er per ongeluk iemand op staat)
    function verwijderFoto(taak) {
      const vorigeFoto = taak.foto;
      taak.foto = "";
      verversScherm();
      toonMelding("Foto verwijderd", () => {
        taak.foto = vorigeFoto;
        verversScherm();
      });
    }

    // ===== MELDING ONDERAAN =====
    let meldingTimer = null;      // de "wekker" die de melding weer verbergt
    let ongedaanActie = null;     // wat er gebeurt bij "Ongedaan maken"

    function toonMelding(tekst, actieBijOngedaan) {
      document.getElementById("melding-tekst").textContent = tekst;
      ongedaanActie = actieBijOngedaan;
      document.getElementById("melding").hidden = false;
      clearTimeout(meldingTimer);                              // oude wekker uitzetten
      meldingTimer = setTimeout(verbergMelding, MELDING_DUUR); // nieuwe wekker zetten
    }

    function verbergMelding() {
      document.getElementById("melding").hidden = true;
      ongedaanActie = null;
    }

    document.getElementById("knop-ongedaan").addEventListener("click", () => {
      if (ongedaanActie) ongedaanActie();
      verbergMelding();
    });

    // Zet een lijst taken op het scherm
    function toonLijst(lijst) {
      const inhoud = document.getElementById("inhoud");
      if (lijst.length === 0) {
        const leeg = document.createElement("p");
        leeg.className = "leeg";
        leeg.textContent = "Er zijn hier geen taken.";
        inhoud.append(leeg);
        return;
      }
      lijst.sort(sorteerTaken);
      lijst.forEach(taak => inhoud.append(maakTaakKaart(taak)));
    }

    // Laat in het menu zien welk scherm open is
    function markeerMenu(scherm) {
      const knopMijn = document.getElementById("knop-mijn");
      const knopWerkgroep = document.getElementById("knop-werkgroep");
      if (scherm === "mijn") {
        knopMijn.setAttribute("aria-current", "page");
        knopWerkgroep.removeAttribute("aria-current");
      } else {
        knopWerkgroep.setAttribute("aria-current", "page");
        knopMijn.removeAttribute("aria-current");
      }
    }

    // ===== SCHERMEN =====

    let huidigScherm = "mijn";   // onthoudt welk scherm open is

    // Tekent het huidige scherm opnieuw (na een wijziging)
    function verversScherm() {
      if (huidigScherm === "mijn") toonMijnTaken();
      else toonWerkgroep();
    }

    function toonMijnTaken() {
      huidigScherm = "mijn";
      document.getElementById("titel").textContent = "Mijn taken";
      document.getElementById("inhoud").replaceChildren(); // scherm leegmaken
      const mijnTaken = taken.filter(isMijnTaak);          // NIEUW: telt ook Frion-taken mee
      toonLijst(mijnTaken);
      markeerMenu("mijn");
    }

    let gekozenWerkgroep = ingelogdeGebruiker.werkgroepen[0];

    function toonWerkgroep() {
      huidigScherm = "werkgroep";
      document.getElementById("titel").textContent = "Taken werkgroep";
      const inhoud = document.getElementById("inhoud");
      inhoud.replaceChildren();

      // Welke keuzes krijgt deze persoon?
      const keuzes = ingelogdeGebruiker.magAllesZien
        ? ["Alles", ...alleWerkgroepen]
        : ingelogdeGebruiker.werkgroepen;
      if (!keuzes.includes(gekozenWerkgroep)) gekozenWerkgroep = keuzes[0];

      // Keuzeknoppen alleen tonen als er iets te kiezen valt
      if (keuzes.length > 1) {
        const kiezer = document.createElement("div");
        kiezer.className = "kiezer";
        keuzes.forEach(naam => {
          const knop = document.createElement("button");
          knop.textContent = naam;
          knop.setAttribute("aria-pressed", naam === gekozenWerkgroep);
          knop.addEventListener("click", () => {
            gekozenWerkgroep = naam;
            toonWerkgroep();
          });
          kiezer.append(knop);
        });
        inhoud.append(kiezer);
      }

      const lijst = gekozenWerkgroep === "Alles"
        ? [...taken]
        : taken.filter(taak => taak.werkgroep === gekozenWerkgroep);
      toonLijst(lijst);
      markeerMenu("werkgroep");
    }

    // ===== START =====
    document.getElementById("knop-mijn").addEventListener("click", toonMijnTaken);
    document.getElementById("knop-werkgroep").addEventListener("click", toonWerkgroep);
    toonMijnTaken();
  </script>
</body>
</html>
